<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐉</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dragons | Gallery</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="resp.css" />
  </head>
  <body>
    <!-- ---------- Navigation ---------- -->
    <nav class="navbar navbar-expand-md navbar-dark nv">
      <div class="container">
        <a class="navbar-brand" href="index.html">🐉 Dragons</a>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#m"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="m">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About Dragons</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="types.html">Types</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="gallery.html">Gallery</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>

            <li class="nav-item d-flex align-items-center ms-3">
              <button id="theme-btn" class="btn btn-outline-warning btn-sm">
                🌙 Theme
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ---------- Main Content ---------- -->
    <main class="container my-5">
      <h1 class="text-center mb-4">Dragons Gallery</h1>

      <!-- Controls: Search + Sort + Filter + Favorites -->
      <div class="row mb-4 align-items-center g-2">
        <div class="col-md-4">
          <input
            type="text"
            id="search"
            class="form-control"
            placeholder="Search dragons..."
          />
        </div>
        <div class="col-md-3">
          <select id="sort-select" class="form-select">
            <option value="name">Sort by Name</option>
            <option value="type">Sort by Type</option>
            <option value="source">Sort by Source</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="filter-source" class="form-select">
            <option value="all">All Sources</option>
            <option value="standard">Standard</option>
            <option value="user">My Dragons</option>
          </select>
        </div>
        <div class="col-md-2 text-md-end">
          <span class="badge bg-warning text-dark fs-6"
            >Favorites: <span id="fav-count">0</span></span
          >
        </div>
      </div>

      <!-- Hidden box for jQuery slideToggle -->
      <div id="jq-box" class="jq-box">
        <p class="m-0">
          🐉 Fun fact: In Chinese mythology, the dragon is a symbol of wisdom
          and rain, not of evil!
        </p>
      </div>
      <button id="jq-toggle" class="btn btn-info text-white mb-3">
        jQuery: show fact
      </button>

      <!-- Gallery Grid -->
      <section
        class="gr"
        id="gallery-container"
        style="display: none"
      ></section>

      <!-- ============================================================ -->
      <!-- CRUD: user-created dragons                                    -->
      <!-- ============================================================ -->
      <section class="mt-5">
        <h2 class="mb-3">My Dragons (CRUD)</h2>
        <form id="dragon-form" class="row g-2 mb-3">
          <div class="col-md-3">
            <input
              type="text"
              id="d-name"
              class="form-control"
              placeholder="Name"
              required
            />
          </div>
          <div class="col-md-3">
            <input
              type="text"
              id="d-desc"
              class="form-control"
              placeholder="Description"
              required
            />
          </div>
          <div class="col-md-3">
            <select id="d-type" class="form-select">
              <option>European</option>
              <option>Chinese</option>
              <option>Japanese</option>
              <option>Slavic</option>
              <option>Other</option>
            </select>
          </div>
          <div class="col-md-3">
            <button type="submit" class="btn btn-success w-100">
              Add Dragon
            </button>
          </div>
        </form>
        <div id="user-dragons" class="row g-3"></div>
      </section>
    </main>

    <!-- ---------- Footer ---------- -->
    <footer class="ft">
      <p class="m-0">Educational project "Dragons" © 2025</p>
    </footer>

    <a href="#" class="up">↑</a>

    <!-- ---------- JS Scripts ---------- -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="dragon.js"></script>
    <script src="main.js"></script>
    <script src="jquery.js"></script>
  </body>
</html>
