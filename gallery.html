<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Драконы | Галерея</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="resp.css" />
  </head>
  <body>
    <!-- ---------- Navigation ---------- -->
    <nav class="navbar navbar-expand-md navbar-dark nv">
      <div class="container">
        <a class="navbar-brand" href="index.html">🐉 Драконы</a>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#m"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="m">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Главная</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">О драконах</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="types.html">Виды</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="gallery.html">Галерея</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Контакты</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ---------- Main Content ---------- -->
    <main class="container my-5">
      <h1 class="text-center mb-4">Галерея драконов</h1>

      <!-- Controls: Search, Theme, Favorites, jQuery -->
      <div class="row mb-4 align-items-center">
        <div class="col-md-5 mb-2">
          <input
            type="text"
            id="search"
            class="form-control"
            placeholder="Поиск дракона..."
          />
        </div>
        <div class="col-md-7 text-md-end">
          <button id="theme-btn" class="btn btn-dark">Сменить тему</button>
          <button id="jq-toggle" class="btn btn-info text-white">
            jQuery: показать факт
          </button>
          <span class="badge bg-warning text-dark fs-6 ms-2"
            >Избранное: <span id="fav-count">0</span></span
          >
        </div>
      </div>

      <!-- Hidden box for jQuery slideToggle -->
      <div
        id="jq-box"
        style="
          display: none;
          background: #e2e3e5;
          padding: 15px;
          margin-bottom: 20px;
          border-radius: 5px;
        "
      >
        <p class="m-0">
          🐉 Интересный факт: В китайской мифологии дракон — это символ мудрости
          и дождя, а не зла!
        </p>
      </div>

      <!-- Gallery Grid (Cards are generated by JavaScript) -->
      <section class="gr" id="gallery-container" style="display: none">
        <!-- JS will append dynamically created <figure> elements here -->
      </section>
    </main>

    <!-- ---------- Footer ---------- -->
    <footer class="ft">
      <p class="m-0">Учебный проект «Драконы» © 2025</p>
    </footer>

    <a href="#" class="up">↑</a>

    <!-- ---------- JS & jQuery Scripts ---------- -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="main.js"></script>
    <script src="jquery.js"></script>
  </body>
</html>
