<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dragons | Gallery</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="resp.css" />
  </head>
  <body>
    <!-- ---------- Navigation ---------- -->
    <nav class="navbar navbar-expand-md navbar-dark nv">
      <div class="container">
        <a class="navbar-brand" href="index.html">🐉 Dragons</a>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#m"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="m">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About Dragons</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="types.html">Types</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="gallery.html">Gallery</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>

            <!-- Theme button -->
            <li class="nav-item d-flex align-items-center ms-3">
              <button id="theme-btn" class="btn btn-outline-warning btn-sm">
                🌙 Theme
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ---------- Main Content ---------- -->
    <main class="container my-5">
      <h1 class="text-center mb-4">Dragons Gallery</h1>

      <!-- Controls: Search, Favorites, jQuery -->
      <div class="row mb-4 align-items-center">
        <div class="col-md-5 mb-2">
          <input
            type="text"
            id="search"
            class="form-control"
            placeholder="Search a dragon..."
          />
        </div>
        <div class="col-md-7 text-md-end">
          <button id="jq-toggle" class="btn btn-info text-white">
            jQuery: show fact
          </button>
          <span class="badge bg-warning text-dark fs-6 ms-2"
            >Favorites: <span id="fav-count">0</span></span
          >
        </div>
      </div>

      <!-- Hidden box for jQuery slideToggle -->
      <div
        id="jq-box"
        style="
          display: none;
          background: #e2e3e5;
          padding: 15px;
          margin-bottom: 20px;
          border-radius: 5px;
        "
      >
        <p class="m-0">
          🐉 Fun fact: In Chinese mythology, the dragon is a symbol of wisdom
          and rain, not of evil!
        </p>
      </div>

      <!-- Gallery Grid -->
      <section
        class="gr"
        id="gallery-container"
        style="display: none"
      ></section>
    </main>

    <!-- ---------- Footer ---------- -->
    <footer class="ft">
      <p class="m-0">Educational project "Dragons" © 2025</p>
    </footer>

    <a href="#" class="up">↑</a>

    <!-- ---------- JS & jQuery Scripts ---------- -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="main.js"></script>
    <script src="jquery.js"></script>
  </body>
</html>
