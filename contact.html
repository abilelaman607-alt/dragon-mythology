<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Драконы | Контакты</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="resp.css" />
  </head>
  <body>
    <!-- ---------- Navigation ---------- -->
    <nav class="navbar navbar-expand-md navbar-dark nv">
      <div class="container">
        <a class="navbar-brand" href="index.html">🐉 Драконы</a>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#m"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="m">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Главная</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">О драконах</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="types.html">Виды</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="gallery.html">Галерея</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contact.html">Контакты</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ---------- Main Content & Form Validation ---------- -->
    <main class="container my-5">
      <h1 class="text-center mb-4">Обратная связь</h1>
      <p class="text-center mb-5">
        Напишите, какой дракон вам нравится больше всего.
      </p>

      <div class="row justify-content-center">
        <div class="col-md-8 mb-4">
          <!-- ВАЖНО: id="contact-form" нужен для JS -->
          <form
            id="contact-form"
            action="#"
            method="post"
            class="p-3 border rounded"
          >
            <div class="mb-3">
              <label for="name" class="form-label">Ваше имя</label>
              <input
                type="text"
                class="form-control"
                id="name"
                placeholder="Иван"
              />
              <small id="name-err" class="text-danger"></small>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="text"
                class="form-control"
                id="email"
                placeholder="ivan@mail.ru"
              />
              <small id="email-err" class="text-danger"></small>
            </div>

            <div class="mb-3">
              <label for="d" class="form-label">Любимый дракон</label>
              <select class="form-select" id="d" name="d">
                <option>Европейский</option>
                <option>Китайский</option>
                <option>Японский</option>
                <option>Змей Горыныч</option>
                <option>Виверна</option>
              </select>
            </div>

            <button type="submit" class="btn btn-warning">Отправить</button>
            <p id="success-msg" class="mt-3 fw-bold"></p>
          </form>
        </div>
      </div>
    </main>

    <!-- ---------- Footer ---------- -->
    <footer class="ft">
      <p class="m-0">Учебный проект «Драконы» © 2025</p>
    </footer>

    <a href="#" class="up">↑</a>

    <!-- ---------- JS & jQuery Scripts ---------- -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="main.js"></script>
    <script src="jquery.js"></script>
  </body>
</html>
