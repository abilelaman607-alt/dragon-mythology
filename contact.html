<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐉</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dragons | Contact</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="resp.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-md navbar-dark nv">
      <div class="container">
        <a class="navbar-brand" href="index.html">🐉 Dragons</a>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#m"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="m">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About Dragons</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="types.html">Types</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="gallery.html">Gallery</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contact.html">Contact</a>
            </li>
            <li class="nav-item d-flex align-items-center ms-3">
              <button id="theme-btn" class="btn btn-outline-warning btn-sm">
                🌙 Theme
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <h1 class="text-center mb-4">Contact Us</h1>
      <p class="text-center mb-5">Tell us which dragon you like most.</p>

      <div class="row justify-content-center">
        <div class="col-md-8 mb-4">
          <form
            id="contact-form"
            action="#"
            method="post"
            class="p-3 border rounded"
          >
            <div class="mb-3">
              <label for="name" class="form-label">Your Name</label>
              <input
                type="text"
                class="form-control"
                id="name"
                placeholder="John"
              />
              <small id="name-err" class="text-danger"></small>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="text"
                class="form-control"
                id="email"
                placeholder="john@mail.com"
              />
              <small id="email-err" class="text-danger"></small>
            </div>

            <div class="mb-3">
              <label for="d" class="form-label">Favorite Dragon</label>
              <select class="form-select" id="d" name="d">
                <option>European</option>
                <option>Chinese</option>
                <option>Japanese</option>
                <option>Zmey Gorynych</option>
                <option>Wyvern</option>
              </select>
            </div>

            <button type="submit" class="btn btn-warning">Send</button>
            <p id="success-msg" class="mt-3 fw-bold"></p>
          </form>
        </div>
      </div>
    </main>

    <footer class="ft">
      <p class="m-0">Educational project "Dragons" © 2025</p>
    </footer>

    <a href="#" class="up">↑</a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="dragon.js"></script>
    <script src="main.js"></script>
    <script src="jquery.js"></script>
  </body>
</html>
